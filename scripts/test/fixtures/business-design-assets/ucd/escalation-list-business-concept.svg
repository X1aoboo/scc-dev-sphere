<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="listTitle listDesc">
  <title id="listTitle">升级处置列表业务概念线框图</title>
  <desc id="listDesc">展示运营人员定位受影响租户、业务阶段、当前责任和下一步动作所需的信息，不在列表提供高危恢复操作。</desc>
  <defs>
    <style>
      .bg{fill:#f4f7fb}.surface{fill:#fff;stroke:#c7d2e3;stroke-width:1.5}.nav{fill:#0f2747}.blue{fill:#1769e0}.soft{fill:#eaf2ff}.amber{fill:#fff4d6;stroke:#e0a11b}.red{fill:#fdeaea;stroke:#dc3b3b}.green{fill:#e8f7ef;stroke:#2d8a57}
      .h1{font:700 28px "Microsoft YaHei","Noto Sans SC",Arial,sans-serif;fill:#10233f}.h2{font:700 18px "Microsoft YaHei","Noto Sans SC",Arial,sans-serif;fill:#10233f}.text{font:15px "Microsoft YaHei","Noto Sans SC",Arial,sans-serif;fill:#253858}.small{font:13px "Microsoft YaHei","Noto Sans SC",Arial,sans-serif;fill:#617089}.label{font:600 13px "Microsoft YaHei","Noto Sans SC",Arial,sans-serif;fill:#44536a}.white{font:600 15px "Microsoft YaHei","Noto Sans SC",Arial,sans-serif;fill:#fff}.call{fill:#1769e0;stroke:#fff;stroke-width:2}.callText{font:700 13px Arial,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central}.line{stroke:#c7d2e3;stroke-width:1.3}
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>
  <rect class="nav" width="1440" height="64"/>
  <text class="white" x="32" y="40" style="font-size:19px">业务概念原型｜审批 SLA 升级处置</text>
  <text class="white" x="1242" y="39" style="font-weight:400">租户运营视角</text>

  <g transform="translate(70,92)">
    <text class="h1" x="0" y="30">需要关注的升级</text>
    <text class="small" x="0" y="58">目标：先定位影响范围和业务停滞点，再进入详情理解；列表不直接执行恢复动作。</text>
    <rect x="0" y="82" width="1300" height="62" rx="10" fill="#eaf2ff" stroke="#8fb5ef"/>
    <text class="h2" x="22" y="110" style="fill:#174f9b">本页必须回答</text>
    <text class="text" x="188" y="111">哪些租户受影响？　停在哪个业务阶段？　当前谁负责？　下一步会发生什么？</text>
    <text class="small" x="188" y="133">内部事件、Trace、消息标识不作为业务定位的首要信息</text>

    <rect class="surface" x="0" y="168" width="1300" height="112" rx="10"/>
    <text class="label" x="22" y="197">业务状态</text><rect class="surface" x="22" y="208" width="196" height="42" rx="6"/><text class="text" x="38" y="235">需要人工处置⌄</text>
    <text class="label" x="242" y="197">停滞时长</text><rect class="surface" x="242" y="208" width="170" height="42" rx="6"/><text class="text" x="258" y="235">超过 30 分钟⌄</text>
    <text class="label" x="436" y="197">租户范围</text><rect class="surface" x="436" y="208" width="196" height="42" rx="6"/><text class="text" x="452" y="235">我的授权范围⌄</text>
    <text class="label" x="656" y="197">任务标识</text><rect class="surface" x="656" y="208" width="236" height="42" rx="6"/><text class="small" x="672" y="235">输入脱敏任务标识</text>
    <rect class="blue" x="916" y="208" width="96" height="42" rx="6"/><text class="white" x="947" y="235">查询</text>
    <text class="text" x="1036" y="235" style="fill:#1769e0">清除筛选</text>
    <circle class="call" cx="1262" cy="223" r="16"/><text class="callText" x="1262" y="223">1</text>

    <g transform="translate(0,304)">
      <rect class="surface" width="304" height="96" rx="10"/><text class="small" x="18" y="29">需要人工处置</text><text class="h1" x="18" y="68">3</text><text class="small" x="54" y="67">项</text>
      <rect class="surface" x="328" width="304" height="96" rx="10"/><text class="small" x="346" y="29">仍在自动处理</text><text class="h1" x="346" y="68">12</text><text class="small" x="397" y="67">项</text>
      <rect class="surface" x="656" width="304" height="96" rx="10"/><text class="small" x="674" y="29">最久停滞</text><text class="h1" x="674" y="68">47 分钟</text>
      <rect class="surface" x="984" width="316" height="96" rx="10"/><text class="small" x="1002" y="29">下一次业务核对</text><text class="h2" x="1002" y="67">1 分 32 秒后</text>
      <circle class="call" cx="1272" cy="18" r="16"/><text class="callText" x="1272" y="18">2</text>
    </g>

    <rect class="surface" x="0" y="424" width="1300" height="338" rx="10"/>
    <rect x="0" y="424" width="1300" height="48" rx="10" fill="#eef2f7"/>
    <text class="label" x="24" y="454">受控任务标识</text><text class="label" x="210" y="454">影响租户</text><text class="label" x="370" y="454">业务结果</text><text class="label" x="570" y="454">停滞阶段 / 时长</text><text class="label" x="800" y="454">当前责任</text><text class="label" x="1000" y="454">下一步</text><text class="label" x="1230" y="454">查看</text>
    <line class="line" x1="0" y1="548" x2="1300" y2="548"/><line class="line" x1="0" y1="624" x2="1300" y2="624"/><line class="line" x1="0" y1="700" x2="1300" y2="700"/>
    <text class="text" x="24" y="516">AP-****-2418</text><text class="text" x="210" y="516">华东一部</text><rect class="red" x="370" y="490" width="150" height="34" rx="17"/><text class="small" x="389" y="512" style="fill:#a32626">需要人工处置</text><text class="text" x="570" y="506">通知义务</text><text class="small" x="570" y="529">已停滞 47 分钟</text><text class="text" x="800" y="506">租户运营</text><text class="small" x="800" y="529">协同通知负责人</text><text class="text" x="1000" y="506">核对送达结果</text><text class="small" x="1000" y="529">无自动动作</text><text class="text" x="1230" y="516" style="fill:#1769e0">详情 ›</text>
    <text class="text" x="24" y="592">AP-****-1982</text><text class="text" x="210" y="592">华南零售</text><rect class="amber" x="370" y="566" width="150" height="34" rx="17"/><text class="small" x="391" y="588" style="fill:#93610b">尚未确认结果</text><text class="text" x="570" y="582">通知核对</text><text class="small" x="570" y="605">已等待 18 分钟</text><text class="text" x="800" y="582">自动业务处理</text><text class="small" x="800" y="605">无需人工介入</text><text class="text" x="1000" y="582">2 分钟后自动核对</text><text class="text" x="1230" y="592" style="fill:#1769e0">详情 ›</text>
    <text class="text" x="24" y="668">AP-****-1765</text><text class="text" x="210" y="668">华北制造</text><rect class="amber" x="370" y="642" width="150" height="34" rx="17"/><text class="small" x="390" y="664" style="fill:#93610b">资料暂不可判定</text><text class="text" x="570" y="658">责任关系判断</text><text class="small" x="570" y="681">已停滞 35 分钟</text><text class="text" x="800" y="658">组织资料负责人</text><text class="text" x="1000" y="658">资料修正后重判</text><text class="text" x="1230" y="668" style="fill:#1769e0">详情 ›</text>
    <text class="text" x="24" y="744">AP-****-1531</text><text class="text" x="210" y="744">华东一部</text><rect class="green" x="370" y="718" width="150" height="34" rx="17"/><text class="small" x="408" y="740" style="fill:#216b45">处理中</text><text class="text" x="570" y="734">升级对象确认</text><text class="small" x="570" y="757">已处理 3 分钟</text><text class="text" x="800" y="734">自动业务处理</text><text class="text" x="1000" y="734">继续自动处理</text><text class="text" x="1230" y="744" style="fill:#1769e0">详情 ›</text>
    <circle class="call" cx="1278" cy="492" r="16"/><text class="callText" x="1278" y="492">3</text>

    <g transform="translate(0,790)">
      <circle class="call" cx="16" cy="0" r="16"/><text class="callText" x="16" y="0">1</text><text class="small" x="42" y="5">筛选基于业务任务，不要求用户理解内部处理标识。</text>
      <circle class="call" cx="450" cy="0" r="16"/><text class="callText" x="450" y="0">2</text><text class="small" x="476" y="5">概览同时表达人工责任与下一自动核对。</text>
      <circle class="call" cx="900" cy="0" r="16"/><text class="callText" x="900" y="0">3</text><text class="small" x="926" y="5">必须进入详情理解上下文后才能处置。</text>
    </g>
  </g>
</svg>
