name: CLI cross-platform

on:
  push:
    paths:
      - 'bin/**'
      - 'hooks/hooks.json'
      - 'scripts/devsphere-cli.js'
      - 'scripts/devsphere-guard.js'
      - 'scripts/knowledge-query.js'
      - 'scripts/setup-devsphere-bash-path.sh'
      - 'scripts/test/devsphere-bash-path.test.js'
      - 'scripts/test/devsphere-cli.test.js'
      - 'scripts/test/skill-contracts.test.js'
      - '.github/workflows/cli-cross-platform.yml'
  pull_request:
    paths:
      - 'bin/**'
      - 'hooks/hooks.json'
      - 'scripts/devsphere-cli.js'
      - 'scripts/devsphere-guard.js'
      - 'scripts/knowledge-query.js'
      - 'scripts/setup-devsphere-bash-path.sh'
      - 'scripts/test/devsphere-bash-path.test.js'
      - 'scripts/test/devsphere-cli.test.js'
      - 'scripts/test/skill-contracts.test.js'
      - '.github/workflows/cli-cross-platform.yml'

permissions:
  contents: read

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run focused CLI tests
        run: node --test scripts/test/devsphere-bash-path.test.js scripts/test/devsphere-cli.test.js scripts/test/skill-contracts.test.js
      - name: Smoke test POSIX launcher
        if: runner.os != 'Windows'
        run: ./bin/devsphere --help
      - name: Smoke test Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\bin\devsphere.cmd --help
